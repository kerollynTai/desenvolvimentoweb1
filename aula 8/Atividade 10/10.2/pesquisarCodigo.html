<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pesquisar alunos</title>
</head>
<body>
    <h1>Pesquisar aluno por seu código:</h1>

    <form action="/pesquisarCodigo" method="get">

        <label for="id"> Código do aluno:</label> <br>
        <input type="number" id="id" name="id" placeholder="Digite o código do produto" min="1" required> <br>
        <br>
        <input type="submit" value="Pesquisar">
        <br>
        <br>
        <a href="/">Voltar ao menu</a>

    </form>
</body>
</html>
